<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/tokens/colors.css">
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/tokens/themes.css">
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/tokens/typography.css">
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/tokens/base.css">
  <link rel="stylesheet" href="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/styles.css">
  <script src="_ds/web-mobil-ui-42216340-78d9-40a3-aeba-17cc9fc3d1bc/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<div style="font-family:var(--font-sans);font-size:16px;line-height:1.5;color:var(--text-body)">
  <div role="button" tabindex="0" onClick="{{ open }}" onKeyDown="{{ keyOpen }}" style="display:block;width:100%;text-align:start;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 3px 4px rgba(0,0,0,.03);transition:border-color 160ms cubic-bezier(.4,0,.2,1)" style-hover="border-color:var(--color-primary)">

    <div style="position:relative;height:150px;background:var(--surface-muted)">
      <image-slot id="{{ slotId }}" src="{{ photoSrc }}" shape="rect" placeholder="{{ photoLabel }}"></image-slot>
      <div style="position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;pointer-events:none">
        <sc-if value="{{ verified }}" hint-placeholder-val="{{ true }}">
          <span style="display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--color-success);font-size:12px;font-weight:700">
            <x-import component-from-global-scope="WebMobilUI_422163.Icon" name="verify" size="{{ 14 }}" hint-size="14px,14px"></x-import>
            {{ verifiedLabel }}
          </span>
        </sc-if>
      </div>
      <div style="position:absolute;top:10px;inset-inline-end:10px;display:flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--text-heading);font-size:12px;font-weight:700;pointer-events:none">
        <span style="color:var(--color-warning);display:flex">
          <x-import component-from-global-scope="WebMobilUI_422163.Icon" name="star" size="{{ 14 }}" hint-size="14px,14px"></x-import>
        </span>
        {{ rating }}
      </div>
      <div style="position:absolute;bottom:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:rgba(11,26,43,.82);color:#fff;font-size:12px;font-weight:600;pointer-events:none">
        <x-import component-from-global-scope="WebMobilUI_422163.Icon" name="rocket" size="{{ 13 }}" hint-size="13px,13px"></x-import>
        {{ distance }}
      </div>
    </div>

    <div style="padding:14px 16px 16px">
      <div style="font-size:18px;font-weight:600;line-height:1.3;color:var(--text-heading);letter-spacing:-.01em">{{ name }}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:14px;color:var(--text-muted)">
        <span style="color:var(--color-primary);display:flex">
          <x-import component-from-global-scope="WebMobilUI_422163.Icon" name="category" size="{{ 15 }}" hint-size="15px,15px"></x-import>
        </span>
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ location }}</span>
      </div>

      <sc-if value="{{ hasWhy }}">
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--color-primary);font-weight:600;text-wrap:pretty">{{ whyLabel }}</div>
      </sc-if>

      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
        <sc-if value="{{ isWholesale }}">
          <span style="display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--color-primary-soft);color:var(--color-primary)">{{ wholesaleLabel }}</span>
        </sc-if>
        <sc-if value="{{ isRetail }}">
          <span style="display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--color-info-soft);color:var(--color-info)">{{ retailLabel }}</span>
        </sc-if>
        <sc-if value="{{ isProducer }}">
          <span style="display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--color-success-soft);color:var(--color-success-accent)">{{ producerLabel }}</span>
        </sc-if>
        <sc-if value="{{ isTaxFree }}">
          <span style="display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--color-accent-soft);color:var(--color-accent-accent)">{{ taxFreeLabel }}</span>
        </sc-if>
        <sc-if value="{{ hasMin }}">
          <span style="display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-muted);color:var(--text-muted);border:1px solid var(--border-default)">{{ minLabel }}</span>
        </sc-if>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px">
        <div style="display:flex;flex-wrap:wrap;gap:6px;min-width:0">
          <sc-for list="{{ tags }}" as="t" hint-placeholder-count="2">
            <x-import component-from-global-scope="WebMobilUI_422163.Tag" hint-size="auto,24px">{{ t }}</x-import>
          </sc-for>
        </div>
        <sc-if value="{{ hasPrice }}">
          <div style="flex:none;text-align:end">
            <div style="font-size:11px;color:var(--text-muted);line-height:1.2">{{ fromLabel }}</div>
            <div style="font-size:18px;font-weight:700;color:var(--color-primary);letter-spacing:-.01em">{{ price }}</div>
            <sc-if value="{{ hasAlt }}">
              <div style="font-size:11.5px;color:var(--text-muted);line-height:1.2;margin-top:1px">{{ alt }}</div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:398,&quot;height&quot;:300},&quot;storeName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Emre Aksesuar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;verified&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4.6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;location&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Yıldız Han · Kat 2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;distance&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;120 m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;₺42&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fromLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;başlangıç&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tags&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Telefon kılıfı&quot;,&quot;Powerbank&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;slotId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;photoLabel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;verifiedLabel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const open = () => { if (p.onOpen) p.onOpen(); };
    return {
      name: p.storeName ?? "Mağaza",
      slotId: "store-photo-" + (p.slotId ?? p.storeName ?? "x"),
      photoLabel: p.photoLabel ?? "Fotoğraf",
      photoSrc: p.photoSrc ?? "assets/ph-shop.png",
      verified: p.verified ?? false,
      verifiedLabel: p.verifiedLabel ?? "Doğrulanmış",
      rating: p.rating ?? "—",
      distance: p.distance ?? "",
      location: p.location ?? "",
      tags: (p.tags ?? []).slice(0, 2),
      price: p.price ?? "",
      hasPrice: !!p.price,
      alt: p.alt ?? "", hasAlt: !!p.alt,
      fromLabel: p.fromLabel ?? "",
      isWholesale: !!p.isWholesale, isRetail: !!p.isRetail,
      isProducer: !!p.isProducer, isTaxFree: !!p.isTaxFree,
      wholesaleLabel: p.wholesaleLabel ?? "Toptan", retailLabel: p.retailLabel ?? "Perakende",
      producerLabel: p.producerLabel ?? "Üretici", taxFreeLabel: p.taxFreeLabel ?? "Tax-free",
      hasMin: !!p.minLabel, minLabel: p.minLabel ?? "",
      hasWhy: !!p.hasWhy, whyLabel: p.whyLabel ?? "",
      open,
      keyOpen: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } }
    };
  }
}
</script>
</body>
</html>
