<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAN — Harita</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#eceff4}
  .pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;
    color:#fff;font-size:12px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.28);border:2px solid #fff}
  .pin-han{background:#1F3864}
  .pin-on{outline:3px solid #E08A2B;outline-offset:2px;transform:scale(1.18);z-index:600}
  #areaSearch{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:500;
    height:38px;padding:0 16px;border-radius:999px;border:1px solid #DBDFE9;background:#fff;
    font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:700;color:#1F3864;
    box-shadow:0 7px 18px rgba(0,0,0,.14);cursor:pointer;white-space:nowrap}
  #areaSearch:hover{background:#EAEEF4}
  #gpsCluster{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .gps-btn{height:36px;padding:0 12px;border-radius:10px;border:1px solid #DBDFE9;background:#fff;
    font-family:Inter,system-ui,sans-serif;font-size:12.5px;font-weight:700;color:#1F3864;
    box-shadow:0 4px 12px rgba(0,0,0,.14);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .gps-btn.active{background:#0BC33F;color:#fff;border-color:#0BC33F}
  #geofenceBar{position:absolute;left:10px;right:10px;top:54px;z-index:520;display:none;
    align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:#14233f;color:#fff;padding:10px 13px;border-radius:12px;
    box-shadow:0 10px 26px rgba(15,23,42,.32);border:1px solid rgba(255,255,255,.18)}
  #geofenceBar b{font-size:13px;display:block}
  #geofenceBar span{font-size:11.5px;color:#cbd5e1;display:block;margin-top:1px}
  #geofenceBar button{height:32px;padding:0 12px;border-radius:8px;border:0;background:#c8872e;color:#fff;
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .pin-area{background:#E08A2B;color:#0b1a2b}
  .pin-me{background:#0BC33F;box-shadow:0 0 0 6px rgba(11,195,63,.26)}
  .pin-stop{background:#1F3864;width:34px;height:34px;font-size:14px}
  .pin-risk{background:#ED143B;width:34px;height:34px;font-size:14px}
  .pop{font-family:Inter,system-ui,sans-serif;min-width:165px}
  .pop b{display:block;font-size:14px;color:#1B1C22;letter-spacing:-.01em}
  .pop span{display:block;font-size:12px;color:#78829D;margin-top:2px}
  .pop button{margin-top:8px;width:100%;height:32px;border:none;border-radius:6px;background:#1F3864;color:#fff;
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .legend{position:absolute;left:10px;bottom:14px;z-index:500;background:rgba(255,255,255,.94);border:1px solid #DBDFE9;border-radius:8px;
    padding:7px 9px;font-size:11px;color:#4B5675;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:999px;margin-inline-end:6px}
  @media (max-width: 640px) {
    .legend{bottom:58px;font-size:10.5px;padding:5px 8px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="gpsCluster">
  <button type="button" class="gps-btn" id="gpsBtn">📍 Canlı Konumumu Bul</button>
</div>
<div id="geofenceBar">
  <div>
    <b id="gfTitle">🏢 Santral Han Girişindesiniz</b>
    <span id="gfSub">Dış GPS → Han içi kat planı ve koridor rehberine geçin</span>
  </div>
  <button type="button" id="gfBtn">🗺️ Kat Planına Geç</button>
</div>
<div class="legend" id="legend"></div>
<script type="module">
import { HANS, AREAS, STORES } from "./han-data.js";

try {
  const geo = JSON.parse(localStorage.getItem("han-geo-v1") || "{}");
  [HANS, AREAS].forEach(list => (list || []).forEach(p => {
    const o = geo[p.id];
    if (!o) return;
    if (typeof o.lat === "number") p.lat = o.lat;
    if (typeof o.lng === "number") p.lng = o.lng;
  }));
} catch {}

const params = new URLSearchParams(location.search);
const lang = params.get("lang") || "tr";
const W = {
  tr: {
    hans: "Tarihi hanlar", areas: "Çarşı bölgeleri", me: "Konumunuz", open: "Aç", shops: "dükkân",
    walk: "dk yürüme", route: "Rotanız", stop: "durak", areaSearch: "Bu alanda ara",
    risk: "Varmadan kapanıyor", gps: "📍 Canlı Konumumu Bul", gpsOn: "📍 Canlı GPS Aktif",
    atGate: "Girişindesiniz", handoff: "Dış GPS → Han içi kat planı ve kamera rehberine geçin",
    openFloor: "🗺️ Kat Planına Geç"
  },
  en: {
    hans: "Historic hans", areas: "Bazaar areas", me: "Your location", open: "Open", shops: "shops",
    walk: "min walk", route: "Your route", stop: "stop", areaSearch: "Search this area",
    risk: "Closes before you arrive", gps: "📍 Find My Location", gpsOn: "📍 Live GPS Active",
    atGate: "At the gate of", handoff: "Outdoor GPS → Switch to indoor floor plan & wayfinder",
    openFloor: "🗺️ Open Floor Plan"
  },
  ru: {
    areaSearch: "Искать здесь", hans: "Исторические ханы", areas: "Районы базара", me: "Ваше положение",
    open: "Открыть", shops: "лавок", walk: "мин пешком", route: "Ваш маршрут", stop: "остановка",
    risk: "Закроется до вашего прихода", gps: "📍 Моя геопозиция", gpsOn: "📍 GPS активен",
    atGate: "У входа в", handoff: "Перейти к поэтажному плану хана", openFloor: "🗺️ План этажа"
  },
  ar: {
    areaSearch: "ابحث في هذه المنطقة", hans: "الخانات التاريخية", areas: "مناطق السوق", me: "موقعك",
    open: "فتح", shops: "متجرًا", walk: "دقيقة سيرًا", route: "مسارك", stop: "محطة",
    risk: "يغلق قبل وصولك", gps: "📍 حدد موقعي", gpsOn: "📍 الموقع مباشر",
    atGate: "أنت عند مدخل", handoff: "انتقل إلى مخطط الطابق الداخلي", openFloor: "🗺️ مخطط الطابق"
  }
}[lang] || {};

document.getElementById("gpsBtn").textContent = W.gps;

const route = (params.get("pts") || "").split(";").filter(Boolean).map(s => {
  const f = s.split(",");
  return { p: [parseFloat(f[0]), parseFloat(f[1])], label: decodeURIComponent(f[2] || ""), risk: f[3] === "1" };
}).filter(x => isFinite(x.p[0]) && isFinite(x.p[1]));

const map = L.map("map", { zoomControl: true, attributionControl: true }).setView([41.0165, 28.9690], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors"
}).addTo(map);

let me = [41.0175, 28.9705];
const dist = (a, b) => {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(x)));
};

const icon = (cls, label) => L.divIcon({ html: '<div class="pin ' + cls + '">' + label + "</div>", className: "", iconSize: [30, 30], iconAnchor: [15, 15] });

const pins = {};
let active = null;
const setActive = (id) => {
  if (active && pins[active]) pins[active]._icon && pins[active]._icon.firstChild.classList.remove("pin-on");
  active = id;
  const m = pins[id];
  if (!m) return;
  if (m._icon) m._icon.firstChild.classList.add("pin-on");
  map.panTo(m.getLatLng(), { animate: true });
  m.openPopup();
};

const bounds = [];
AREAS.forEach(a => {
  if (a.lat == null || route.length) return;
  const p = [a.lat, a.lng]; bounds.push(p);
  const n = STORES.filter(s => {
    const h = HANS.find(x => x.id === s.han);
    return (h ? h.area : s.area) === a.id;
  }).length;
  pins[a.id] = L.marker(p, { icon: icon("pin-area", "◆") }).addTo(map).bindPopup(
    '<div class="pop"><b>' + (a[lang] || a.tr) + "</b><span>" + n + " " + W.shops + " · " +
    Math.max(1, Math.round(dist(me, p) / 80)) + " " + W.walk + '</span><button data-kind="area" data-id="' + a.id + '">' + W.open + "</button></div>"
  );
});

HANS.forEach(h => {
  if (h.lat == null || route.length) return;
  const p = [h.lat, h.lng]; bounds.push(p);
  const n = h.units || STORES.filter(s => s.han === h.id).length;
  const gmaps = "https://www.google.com/maps/dir/?api=1&destination=" + h.lat + "," + h.lng + "&travelmode=walking";
  pins[h.id] = L.marker(p, { icon: icon("pin-han", h.id === "santral" ? "★" : "▣") }).addTo(map).bindPopup(
    '<div class="pop"><b>' + h.name + "</b><span>" + n + " " + W.shops + " · " +
    Math.max(1, Math.round(dist(me, p) / 80)) + " " + W.walk +
    '</span><button data-kind="han" data-id="' + h.id + '">🗺️ ' + W.open + ' & Kat Planı</button>' +
    '<a href="' + gmaps + '" target="_blank" rel="noreferrer" style="display:block;margin-top:5px;text-align:center;line-height:28px;height:28px;border-radius:6px;border:1px solid #1F3864;color:#1F3864;text-decoration:none;font-size:11.5px;font-weight:700">🌍 Google Maps Yürüyüş</a></div>'
  );
});

if (route.length) {
  L.polyline([me].concat(route.map(r => r.p)), {
    color: "#1F3864", weight: 4, opacity: .85, dashArray: "8,6"
  }).addTo(map);
  route.forEach((r, i) => {
    bounds.push(r.p);
    const gmaps = "https://www.google.com/maps/dir/?api=1&destination=" + r.p[0] + "," + r.p[1] + "&travelmode=walking";
    L.marker(r.p, { icon: icon(r.risk ? "pin-risk" : "pin-stop", String(i + 1)) }).addTo(map)
      .bindPopup('<div class="pop"><b>' + r.label + "</b><span>" + (i + 1) + ". " + W.stop +
        (r.risk ? " · " + W.risk : "") +
        '</span><a href="' + gmaps + '" target="_blank" rel="noreferrer" style="display:block;margin-top:8px;text-align:center;line-height:30px;height:30px;border-radius:6px;background:#1F3864;color:#fff;text-decoration:none;font-size:12px;font-weight:700">🌍 Google Maps ile Yürü</a></div>');
  });
}

const meMarker = L.marker(me, { icon: icon("pin-me", "●") }).addTo(map).bindPopup('<div class="pop"><b>' + W.me + "</b></div>");
const meCircle = L.circle(me, { radius: 85, color: "#0BC33F", weight: 1.5, fillOpacity: .10 }).addTo(map);
if (bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.18));

// Check if user is within <= 40m of a Han entrance (Geofence Handoff)
let currentGateHan = null;
const checkGeofence = (coords) => {
  let nearest = null;
  let minD = 999999;
  HANS.forEach(h => {
    if (h.lat == null) return;
    const d = dist(coords, [h.lat, h.lng]);
    if (d < minD) { minD = d; nearest = h; }
  });
  const bar = document.getElementById("geofenceBar");
  if (nearest && minD <= 45) {
    currentGateHan = nearest;
    document.getElementById("gfTitle").textContent = "🏢 " + nearest.name + " " + W.atGate + " (" + minD + " m)";
    document.getElementById("gfSub").textContent = W.handoff;
    document.getElementById("gfBtn").textContent = W.openFloor;
    bar.style.display = "flex";
    parent.postMessage({ source: "han-map", kind: "geofence", id: nearest.id, name: nearest.name, dist: minD }, "*");
  } else {
    bar.style.display = "none";
  }
};

document.getElementById("gfBtn").addEventListener("click", () => {
  if (!currentGateHan) return;
  parent.postMessage({ source: "han-map", kind: "open-floor", id: currentGateHan.id }, "*");
});

// Live GPS Tracking
let watchId = null;
const gpsBtn = document.getElementById("gpsBtn");
const updateMyPos = (lat, lng, accuracy, pan = false) => {
  me = [lat, lng];
  meMarker.setLatLng(me);
  meCircle.setLatLng(me);
  meCircle.setRadius(Math.max(18, Math.min(accuracy || 40, 180)));
  if (pan) map.setView(me, 17, { animate: true });
  checkGeofence(me);
};

gpsBtn.addEventListener("click", () => {
  if (!("geolocation" in navigator)) {
    // Fallback in insecure or desktop test context: center on Santral Han gate
    const sh = HANS.find(h => h.id === "santral") || { lat: 41.0124, lng: 28.9682 };
    updateMyPos(sh.lat, sh.lng, 18, true);
    gpsBtn.classList.add("active");
    gpsBtn.textContent = W.gpsOn;
    return;
  }
  gpsBtn.textContent = "⏳ GPS...";
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      gpsBtn.classList.add("active");
      gpsBtn.textContent = W.gpsOn;
      updateMyPos(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, true);
    },
    () => {
      // If user is outside Istanbul or denies permission during testing, snap to Santral Han entrance so they can test Handoff
      const sh = HANS.find(h => h.id === "santral") || { lat: 41.0124, lng: 28.9682 };
      gpsBtn.classList.add("active");
      gpsBtn.textContent = W.gpsOn + " (Santral Kapısı)";
      updateMyPos(sh.lat, sh.lng, 15, true);
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 5000 }
  );
});

document.getElementById("legend").innerHTML = route.length
  ? '<div><i style="background:#1F3864"></i>' + W.route + " · " + route.length + " " + W.stop + "</div>" +
    (route.some(r => r.risk) ? '<div><i style="background:#ED143B"></i>' + W.risk + "</div>" : "") +
    '<div><i style="background:#0BC33F"></i>' + W.me + "</div>"
  : '<div><i style="background:#1F3864"></i>' + W.hans + "</div>" +
    '<div><i style="background:#E08A2B"></i>' + W.areas + "</div>" +
    '<div><i style="background:#0BC33F"></i>' + W.me + "</div>";

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-kind]");
  if (!b) return;
  parent.postMessage({ source: "han-map", kind: b.dataset.kind, id: b.dataset.id }, "*");
});

Object.keys(pins).forEach(id => {
  pins[id].on("click", () => {
    setActive(id);
    parent.postMessage({ source: "han-map", kind: "hover", id }, "*");
  });
});

window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.source !== "han-web") return;
  if (m.kind === "focus") setActive(m.id);
  if (m.kind === "locate") gpsBtn.click();
  if (m.kind === "simulate-gate") {
    const target = HANS.find(h => h.id === (m.id || "santral")) || HANS[0];
    if (target) {
      gpsBtn.classList.add("active");
      gpsBtn.textContent = W.gpsOn;
      updateMyPos(target.lat, target.lng, 12, true);
    }
  }
  if (m.kind === "clear" && active && pins[active]) {
    pins[active]._icon && pins[active]._icon.firstChild.classList.remove("pin-on");
    pins[active].closePopup();
    active = null;
  }
});

if (!route.length) {
  const btn = document.createElement("button");
  btn.id = "areaSearch";
  btn.textContent = W.areaSearch || "Bu alanda ara";
  btn.addEventListener("click", () => {
    const b = map.getBounds();
    const inside = Object.keys(pins).filter(id => b.contains(pins[id].getLatLng()));
    parent.postMessage({ source: "han-map", kind: "bounds", ids: inside,
      box: { n: b.getNorth(), s: b.getSouth(), e: b.getEast(), w: b.getWest() } }, "*");
  });
  document.body.appendChild(btn);
}
</script>
</body>
</html>
